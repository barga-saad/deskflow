server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The browser only talks to nginx, which forwards API calls to the backend.
    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host keeps the port. Without it, Spring treats same-site browser calls as cross-origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File names contain a content hash, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Unknown paths go to index.html so React Router can handle them.
    location / {
        try_files $uri /index.html;
    }
}
