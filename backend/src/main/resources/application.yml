spring:
  application:
    name: deskflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deskflow}
    username: ${DB_USER:deskflow}
    password: ${DB_PASSWORD:deskflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

deskflow:
  seed-demo-data: ${SEED_DEMO_DATA:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    # No default on purpose: production must supply its own secret (32+ characters).
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:PT1H}
  ai:
    enabled: ${AI_ENABLED:false}
    # Any OpenAI-compatible server works, for example a local Ollama instance.
    base-url: ${AI_BASE_URL:http://localhost:11434/v1}
    model: ${AI_MODEL:llama3.2}
    api-key: ${AI_API_KEY:}
    timeout: ${AI_TIMEOUT:PT20S}
